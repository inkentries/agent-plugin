name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The CLI ships from another repository on its own cadence, so this repo
    # can go stale without anyone touching it. Catch that on a timer rather
    # than on the next edit, which may be months away.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-commands-exist:
    name: The skill and hooks name only commands the released CLI has
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the released inkentry CLI
        run: |
          curl -fsSL https://get.inkentry.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check every command the skill and the hooks name
        run: python3 scripts/check-skill-commands.py

  manifests-valid:
    name: Manifests parse and match their schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Both manifests are valid JSON
        run: |
          python3 -m json.tool plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: All three manifests carry the same version
        run: |
          python3 - <<'PY'
          import json, sys

          versions = {
              "plugin.json": json.load(open("plugin.json"))["version"],
              ".claude-plugin/plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
              ".claude-plugin/marketplace.json": json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"],
          }
          if len(set(versions.values())) != 1:
              sys.exit(f"manifest versions differ: {versions}")
          print(f"ok: every manifest is at {next(iter(versions.values()))}")
          PY

      - name: The portable manifest conforms to the Agent Plugins schema
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request

          manifest = json.load(open("plugin.json"))
          url = manifest["$schema"]
          schema = json.load(urllib.request.urlopen(url))

          errors = []
          for key in schema.get("required", []):
              if key not in manifest:
                  errors.append(f"missing required property {key!r}")
          allowed = set(schema.get("properties", {}))
          for key in manifest:
              if key not in allowed:
                  errors.append(f"{key!r} is not a property this schema allows")
          pattern = schema["properties"]["name"].get("pattern")
          if pattern and not re.match(pattern, manifest["name"]):
              errors.append(f"name {manifest['name']!r} does not match {pattern}")

          if errors:
              print(f"plugin.json does not conform to {url}:", file=sys.stderr)
              for e in errors:
                  print(f"  {e}", file=sys.stderr)
              sys.exit(1)
          print(f"ok: plugin.json conforms to {url}")
          PY

      - name: The skill has the frontmatter that decides when an agent reaches for it
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          text = Path("skills/inkentry/SKILL.md").read_text()
          if not text.startswith("---\n"):
              sys.exit("SKILL.md has no YAML frontmatter, so no client will index it as a skill")
          front = text.split("---\n", 2)[1]
          for field in ("name:", "description:"):
              if field not in front:
                  sys.exit(f"SKILL.md frontmatter is missing {field!r}")
          print("ok: frontmatter carries name and description")
          PY

  hooks:
    name: Hooks are declared correctly and behave
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: hooks.json is valid, and every hook it names exists, is executable and has a timeout
        run: |
          python3 -m json.tool hooks/hooks.json > /dev/null
          python3 - <<'PY'
          import json, os, re, sys

          errors = []
          for event, groups in json.load(open("hooks/hooks.json"))["hooks"].items():
              for group in groups:
                  for hook in group["hooks"]:
                      m = re.fullmatch(r'"\$\{CLAUDE_PLUGIN_ROOT\}/([^"]+)"', hook["command"])
                      if not m:
                          errors.append(f"{event}: command {hook['command']!r} is not a quoted plugin-root path")
                          continue
                      if not os.access(m[1], os.X_OK):
                          errors.append(f"{event}: {m[1]} is missing or not executable")
                      if not isinstance(hook.get("timeout"), int):
                          errors.append(f"{event}: {m[1]} has no timeout")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("ok: every hook in hooks.json exists, is executable and has a timeout")
          PY

      - name: Shellcheck the hooks and their tests
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x --source-path=SCRIPTDIR -s sh hooks/*.sh scripts/test-hooks.sh

      - name: Run every hook against a stub CLI
        run: sh scripts/test-hooks.sh
